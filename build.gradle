plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

extensions {
    loom {
        minecraftVersion = '1.21.4'
        mappingsVersion = '1.21.4+build.1'
        modId = 'chakrachargemod'
        version = '1.0.0'
        accessWidener = 'accessWidener.txt'
        namespaceMap = mapOf(
            'intermediary' to 'named'
        )
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.4:client'
    mappings 'net.fabricmc:yarn:1.21.4+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.15.7'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.96.7+1.21.4'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft.version
}
